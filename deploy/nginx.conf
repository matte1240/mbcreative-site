# Baked into the image at /etc/nginx/conf.d/default.conf.
#
# Two things here are not decoration. The `/healthz` location is what the kubelet
# probes, and it exists so that "is nginx answering?" never depends on the page itself
# being present. The `try_files` fallback is what makes an unknown path serve the app
# shell instead of a 404: the three screens are toggled in the browser, so a reload on
# a deep link has to come back as index.html.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Probed by the kubelet, so it must stay cheap and out of the access log -- three
    # replicas probed every five seconds is otherwise the only traffic anyone sees.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets/, so the filename changes whenever the
    # bytes do. That is the precondition for caching them for a year: a deploy cannot
    # be served stale, because it asks for different names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The one file that is *not* fingerprinted, and the one that names the current
    # bundle. Cached, it would keep a browser pointing at assets a deploy has removed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
